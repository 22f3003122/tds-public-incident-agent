services:
  - type: web
    name: tds-public-incident-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://aipipe.org/openai/v1
      - key: OPENAI_MODEL
        value: gpt-5-nano
      - key: MODEL_TIMEOUT
        value: "13"
